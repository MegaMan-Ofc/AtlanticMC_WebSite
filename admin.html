<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Atlantic Anarchy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .admin-header {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
        }
        
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .tab-btn {
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .config-section {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .config-form {
            display: grid;
            gap: 20px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            font-weight: 600;
            color: var(--text-gray);
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-blue);
        }
        
        .item-list {
            display: grid;
            gap: 15px;
        }
        
        .item-card {
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 80px 1fr auto;
            gap: 20px;
            align-items: center;
        }
        
        .item-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .item-actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-edit, .btn-delete {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-edit {
            background: var(--primary-blue);
            color: white;
        }
        
        .btn-delete {
            background: #ef4444;
            color: white;
        }
        
        .btn-save {
            background: var(--success-green);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-save:hover {
            background: #059669;
            transform: scale(1.02);
        }
        
        .btn-add-new {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-green);
            border: 1px solid var(--success-green);
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1><i class="fas fa-cog"></i> Admin Panel</h1>
            <p style="color: var(--text-gray); margin-top: 10px;">Manage store configuration, prices, and content</p>
            
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('general')">General</button>
                <button class="tab-btn" onclick="switchTab('ranks')">Ranks</button>
                <button class="tab-btn" onclick="switchTab('rubis')">Rubis</button>
                <button class="tab-btn" onclick="switchTab('keys')">Keys</button>
                <button class="tab-btn" onclick="switchTab('discord')">Discord</button>
            </div>
        </div>
        
        <div id="alert-container"></div>
        
        <!-- General Settings -->
        <div id="tab-general" class="tab-content active">
            <div class="config-section">
                <h2>General Settings</h2>
                <form class="config-form" id="form-general">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Server Name</label>
                            <input type="text" id="server-name" placeholder="Atlantic Anarchy">
                        </div>
                        <div class="form-group">
                            <label>Server IP</label>
                            <input type="text" id="server-ip" placeholder="atlantic.net">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Checkout Payment Link</label>
                            <input type="url" id="payment-link" placeholder="https://your-payment-gateway.com/checkout">
                        </div>
                    </div>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Ranks Management -->
        <div id="tab-ranks" class="tab-content">
            <div class="config-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Manage Ranks</h2>
                    <button class="btn-add-new" onclick="addNewRank()">
                        <i class="fas fa-plus"></i> Add New Rank
                    </button>
                </div>
                
                <div class="item-list" id="ranks-list">
                    <!-- Dynamic ranks -->
                </div>
            </div>
        </div>
        
        <!-- Rubis Management -->
        <div id="tab-rubis" class="tab-content">
            <div class="config-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Manage Rubis Packages</h2>
                    <button class="btn-add-new" onclick="addNewRubis()">
                        <i class="fas fa-plus"></i> Add New Package
                    </button>
                </div>
                
                <div class="item-list" id="rubis-list">
                    <!-- Dynamic rubis packages -->
                </div>
            </div>
        </div>
        
        <!-- Keys Management -->
        <div id="tab-keys" class="tab-content">
            <div class="config-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Manage Keys</h2>
                    <button class="btn-add-new" onclick="addNewKey()">
                        <i class="fas fa-plus"></i> Add New Key
                    </button>
                </div>
                
                <div class="item-list" id="keys-list">
                    <!-- Dynamic keys -->
                </div>
            </div>
        </div>
        
        <!-- Discord Settings -->
        <div id="tab-discord" class="tab-content">
            <div class="config-section">
                <h2>Discord Integration</h2>
                <form class="config-form" id="form-discord">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Discord Client ID</label>
                            <input type="text" id="discord-client-id" placeholder="Your Discord Application Client ID">
                        </div>
                        <div class="form-group">
                            <label>Discord Guild ID</label>
                            <input type="text" id="discord-guild-id" placeholder="Your Discord Server ID">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Discord Invite Link</label>
                            <input type="url" id="discord-invite" placeholder="https://discord.gg/yourserver">
                        </div>
                    </div>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
