<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Panel - Atlantic Anarchy</title>
        <script> window.location.replace('index.html'); </script>
        <link rel="stylesheet" href="css/classic-theme.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="css/admin.css">
    </head>
    <body>
        <div class="admin-container">
            <div class="admin-header">
                <h1>
                    <i class="fas fa-cog"></i> Admin Panel</h1>
                <p class="admin-subtitle">Manage store configuration, prices, and content</p>
                <div class="admin-tabs">
                    <button class="tab-btn active" onclick="switchTab('general')">General</button>
                    <button class="tab-btn" onclick="switchTab('ranks')">Ranks</button>
                    <button class="tab-btn" onclick="switchTab('rubis')">Rubis</button>
                    <button class="tab-btn" onclick="switchTab('keys')">Keys</button>
                    <button class="tab-btn" onclick="switchTab('discord')">Discord</button>
                </div>
            </div>
            <div id="alert-container"></div>
            <!-- General Settings -->
            <div id="tab-general" class="tab-content active">
                <div class="config-section">
                    <h2>General Settings</h2>
                    <form class="config-form" id="form-general">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Server Name</label>
                                <input type="text" id="server-name" placeholder="Atlantic Anarchy">
                            </div>
                            <div class="form-group">
                                <label>Server IP</label>
                                <input type="text" id="server-ip" placeholder="atlantic.net">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Checkout Payment Link</label>
                                <input type="url" id="payment-link" placeholder="https://your-payment-gateway.com/checkout">
                            </div>
                        </div>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Save Changes
                    </button>
                    </form>
                </div>
            </div>
            <!-- Ranks Management -->
            <div id="tab-ranks" class="tab-content">
                <div class="config-section">
                    <div class="section-heading">
                        <h2>Manage Ranks</h2>
                        <button class="btn-add-new" onclick="addNewRank()">
                            <i class="fas fa-plus"></i> Add New Rank
                    </button>
                    </div>
                    <div class="item-list" id="ranks-list">
                        <!-- Dynamic ranks -->
                    </div>
                </div>
            </div>
            <!-- Rubis Management -->
            <div id="tab-rubis" class="tab-content">
                <div class="config-section">
                    <div class="section-heading">
                        <h2>Manage Rubis Packages</h2>
                        <button class="btn-add-new" onclick="addNewRubis()">
                            <i class="fas fa-plus"></i> Add New Package
                    </button>
                    </div>
                    <div class="item-list" id="rubis-list">
                        <!-- Dynamic rubis packages -->
                    </div>
                </div>
            </div>
            <!-- Keys Management -->
            <div id="tab-keys" class="tab-content">
                <div class="config-section">
                    <div class="section-heading">
                        <h2>Manage Keys</h2>
                        <button class="btn-add-new" onclick="addNewKey()">
                            <i class="fas fa-plus"></i> Add New Key
                    </button>
                    </div>
                    <div class="item-list" id="keys-list">
                        <!-- Dynamic keys -->
                    </div>
                </div>
            </div>
            <!-- Discord Settings -->
            <div id="tab-discord" class="tab-content">
                <div class="config-section">
                    <h2>Discord Integration</h2>
                    <form class="config-form" id="form-discord">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Discord Client ID</label>
                                <input type="text" id="discord-client-id" placeholder="Your Discord Application Client ID">
                            </div>
                            <div class="form-group">
                                <label>Discord Guild ID</label>
                                <input type="text" id="discord-guild-id" placeholder="Your Discord Server ID">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Discord Invite Link</label>
                                <input type="url" id="discord-invite" placeholder="https://discord.gg/yourserver">
                            </div>
                        </div>
                        <button type="submit" class="btn-save">
                            <i class="fas fa-save"></i> Save Changes
                    </button>
                    </form>
                </div>
            </div>
        </div>
        <script src="js/main.js"></script>
        <script src="js/admin.js"></script>
    </body>
</html>
